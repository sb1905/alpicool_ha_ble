name: Tests

on:
  push:
  pull_request:
  schedule:
    # Every Monday morning. Home Assistant releases monthly, and this shows
    # early when a new release breaks something here.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The version current Home Assistant releases run on.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install the test requirements
        run: pip install -r requirements-test.txt

      - name: Run the tests
        run: python -m pytest

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
